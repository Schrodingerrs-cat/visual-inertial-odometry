# Phase 2 Step K — I-network architectural fix.
#
# Phase 1 (IMUPoseLoss_hover) moved I_avg from 1.242 → 1.215 m on the
# Step K within-family test set: ~2% reduction, well above the 0.6 m
# STOP threshold. Loss-only fix is settled as insufficient.
#
# Phase 2 hypothesis: the bottleneck is the 10 ms IMU window. Per-window
# translation signal is ~3 mm; gravity-integration noise is ~0.5 mm; the
# task is at the noise floor. Replace the 10-sample window with a
# 100-sample (100 ms) causal context window ending just before frame b.
# Matches TLIO/AirIO precedent (200-1000 ms windows).
#
# OPTION (a) plumbing (per spec):
#   * V branch unchanged — uses outputs/step_k/v/best.pt.
#   * VI branch unchanged — uses outputs/step_k/vi/best.pt; consumes
#     the legacy length-10 batch["imu"] tensor (NOT batch["imu_context"]).
#     Eval verifies VI numbers match Phase 1 within 1e-4 m.
#   * I branch retrained on the new length-100 batch["imu_context"].
#     Architecture unchanged (2-layer LSTM, hidden 128). Loss
#     IMUPoseLoss_hover from Phase 1.
#
# Config: inherits step_k.yaml. Only differences are:
#   * data.imu_context_length: 100  (NEW)
#   * paths.outputs_dir:        outputs/step_k_phase2  (separate results)
#
# Decision tree (codified in slurm/step_k_phase2_eval.sh):
#   * I_avg < 0.6 m       → Phase 2 worked. Window was the bottleneck.
#   * I_avg in [0.6, 1.0) → MARGINAL. Architectural capacity bump may
#                            help; document and stop.
#   * I_avg ≥ 1.0 m       → Phase 2 also insufficient. STOP. The
#                            bottleneck is not loss, not window length.
#                            Document architecture or representation as
#                            the residual.

seed: 42

texture:
  raw_dir: Data/textures_raw
  processed_dir: Data/textures_processed
  train_dir: Data/textures_train
  test_dir: Data/textures_test
  plane_longer_m: 28.0
  density_target_px_per_m: 100.0

camera:
  fx: 640.0
  fy: 640.0
  cx: 320.0
  cy: 240.0

image:
  width: 640
  height: 480

data:
  raw_dir: data/raw_g
  train_ids: [312, 313, 314, 315, 316, 317, 318, 319]
  val_traj_id: 320
  minitest_traj_id: 322
  test_ids: [320, 321, 322, 323, 324]
  img_size: [480, 640]
  imu_window: 10               # legacy V/VI window — UNCHANGED
  imu_context_length: 100      # Phase 2: I branch causal context window
  num_workers: 4

model:
  cnn_feat_dim: 512
  lstm_hidden: 128
  variant: tdirect

train:
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-4
  epochs_v: 30
  epochs_i: 20                 # mirrors Step K Phase 0/1
  epochs_vi_stage1: 10
  epochs_vi_stage2: 20
  stage2_lr_mult: 0.0
  grad_clip: 1.0
  warmup_epochs: 2
  log_every: 50

loss:
  w_rot: 10.0
  w_t: 5.0
  w_trans: 5.0
  w_imu_trans: 2.0
  w_rot_imu: 5.0
  hover_mask_center: 0.01      # Phase 1's IMUPoseLoss_hover reads this
  hover_mask_width: 0.005

distill:
  lambda: 1.0
  sigma_eps_t: 0.001
  sigma_eps_R: 0.005
  sigma_px_floor: 0.5
  raft_weights: "Raft_Large_Weights.C_T_SKHT_V2"
  raft_weights_fallback: "Raft_Large_Weights.C_T_V2"

raft:
  num_flow_updates: 12
  correspondence_stride: 16
  ransac_threshold_px: 2.0
  fb_valid_threshold_px: 5.0

augmentation:
  photometric:
    enabled: true
    brightness: 0.3
    contrast: 0.3
    saturation: 0.2
    hue: 0.05
    gaussian_noise_std: 0.01
    grayscale_prob: 0.1

sampling:
  mode: weighted
  alpha: 0.5
  num_bins: 5
  bin_edges_m: [0.0, 0.02, 0.04, 0.06, 0.10, 0.50]

eval:
  segment_seconds: 2.0
  evo_bin: evo_ape

paths:
  outputs_dir:       outputs/step_k_phase2
  checkpoints_dir:   outputs/step_k_phase2
  trajectories_dir:  outputs/step_k_phase2/eval/trajectories
  plots_dir:         outputs/step_k_phase2/eval/plots
  studies_dir:       outputs/step_k_phase2/studies
  sanity_dir:        outputs/step_k_phase2/sanity
